<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebStacker</title>
<style>
  :root {
    --bg: #0b0d12; --panel: #151922; --line: #262c3a;
    --text: #dfe4ee; --dim: #8a93a6; --accent: #5aa9ff; --bad: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.45 -apple-system, Segoe UI, Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  form {
    width: 100%; max-width: 320px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; padding: 22px;
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p { color: var(--dim); margin: 0 0 16px; font-size: 13px; }
  input[type=password] {
    width: 100%; padding: 9px 10px; border-radius: 6px; font: inherit;
    background: var(--bg); color: var(--text); border: 1px solid var(--line);
  }
  input[type=password]:focus { outline: none; border-color: var(--accent); }
  button {
    width: 100%; margin-top: 12px; padding: 9px; border-radius: 6px; font: inherit;
    background: var(--accent); color: #07111f; border: 0; font-weight: 600; cursor: pointer;
  }
  .err { color: var(--bad); font-size: 13px; margin: 10px 0 0; }
</style>
</head>
<body>
  <form method="post" action="/login">
    <h1>WebStacker</h1>
    <p>This stacker is password protected.</p>
    <input type="password" name="password" placeholder="Password" autofocus
           autocomplete="current-password" aria-label="Password">
    <button type="submit">Open</button>
    {{MESSAGE}}
  </form>
</body>
</html>
