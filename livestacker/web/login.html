<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebStacker</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root {
    --bg: #0b0d12; --panel: #151922; --line: #262c3a;
    --text: #dfe4ee; --dim: #8a93a6; --accent: #5aa9ff; --bad: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.45 -apple-system, Segoe UI, Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  form {
    width: 100%; max-width: 320px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; padding: 22px;
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p { color: var(--dim); margin: 0 0 16px; font-size: 13px; }
  input[type=password], input[type=text] {
    width: 100%; padding: 9px 10px; border-radius: 6px; font: inherit;
    background: var(--bg); color: var(--text); border: 1px solid var(--line);
  }
  input[type=password]:focus, input[type=text]:focus { outline: none; border-color: var(--accent); }
  .field { position: relative; }
  .field input { padding-right: 58px; }
  .reveal {
    position: absolute; right: 4px; top: 4px; bottom: 4px; width: auto; margin: 0;
    padding: 0 10px; background: transparent; color: var(--dim);
    border: 0; font-weight: 500; font-size: 12px;
  }
  .reveal:hover { color: var(--text); }
  button {
    width: 100%; margin-top: 12px; padding: 9px; border-radius: 6px; font: inherit;
    background: var(--accent); color: #07111f; border: 0; font-weight: 600; cursor: pointer;
  }
  .err { color: var(--bad); font-size: 13px; margin: 10px 0 0; }
</style>
</head>
<body>
  <form method="post" action="/login">
    <h1>WebStacker</h1>
    <p>This session is password protected.</p>
    <div class="field">
      <input type="password" id="pw" name="password" placeholder="Password" autofocus
             autocomplete="current-password" aria-label="Password">
      <button type="button" class="reveal" id="reveal" aria-pressed="false"
              aria-controls="pw">Show</button>
    </div>
    <button type="submit">Open</button>
    {{MESSAGE}}
  </form>
<script>
  const pw = document.getElementById("pw"), reveal = document.getElementById("reveal");
  reveal.addEventListener("click", () => {
    const show = pw.type === "password";
    pw.type = show ? "text" : "password";
    reveal.textContent = show ? "Hide" : "Show";
    reveal.setAttribute("aria-pressed", show);
    pw.focus();
  });
</script>
</body>
</html>
