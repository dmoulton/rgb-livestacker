<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RGB Livestacker</title>
<style>
  :root {
    --bg: #0b0d12; --panel: #151922; --line: #262c3a;
    --text: #dfe4ee; --dim: #8a93a6; --accent: #5aa9ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.45 -apple-system, Segoe UI, Roboto, sans-serif;
    display: flex; height: 100vh; overflow: hidden;
  }
  #stage {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 16px; min-width: 0; position: relative; overflow: hidden;
  }
  #preview {
    max-width: 100%; max-height: 100%;
    background: #000; border: 1px solid var(--line); border-radius: 4px;
    transform-origin: center center; will-change: transform;
    user-select: none; -webkit-user-drag: none;
    touch-action: none;
  }
  #preview.pannable { cursor: grab; }
  #preview.dragging { cursor: grabbing; }
  #empty { color: var(--dim); text-align: center; }
  #zoomctl {
    position: absolute; left: 12px; bottom: 12px; display: none;
    align-items: center; gap: 2px; padding: 3px;
    background: rgba(12,15,20,.78); border: 1px solid var(--line);
    border-radius: 6px; backdrop-filter: blur(4px);
  }
  #zoomctl button {
    padding: 3px 9px; min-width: 30px; line-height: 1.1;
  }
  #zoomctl .zval {
    color: var(--dim); font-variant-numeric: tabular-nums;
    min-width: 46px; text-align: center; font-size: 12px;
  }
  aside {
    width: 300px; flex-shrink: 0; background: var(--panel);
    border-left: 1px solid var(--line); padding: 18px 18px 24px;
    overflow-y: auto;
  }
  h1 { font-size: 15px; margin: 0 0 4px; letter-spacing: .3px; }
  .sub { color: var(--dim); font-size: 12px; margin-bottom: 18px; }
  h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .8px;
    color: var(--dim); margin: 22px 0 10px; font-weight: 600;
  }
  .ctl { margin-bottom: 14px; }
  .ctl label { display: flex; justify-content: space-between; margin-bottom: 5px; }
  .ctl label span:last-child { color: var(--accent); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .row input[type=checkbox] { accent-color: var(--accent); width: 15px; height: 15px; }
  button, a.btn {
    display: inline-block; background: #1e2430; color: var(--text);
    border: 1px solid var(--line); border-radius: 4px; padding: 7px 12px;
    font: inherit; cursor: pointer; text-decoration: none;
  }
  button:hover, a.btn:hover { border-color: var(--accent); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td { padding: 3px 0; }
  td:last-child { text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; }
  .chan-R { color: #ff6b6b; } .chan-G { color: #59d98b; } .chan-B { color: #5aa9ff; }
  #conn { font-size: 12px; color: var(--dim); margin-top: 20px; }
  #conn.ok::before { content: "● "; color: #59d98b; }
  #conn.down::before { content: "● "; color: #ff6b6b; }
</style>
</head>
<body>
  <div id="stage">
    <img id="preview" alt="" hidden>
    <div id="empty">Waiting for the first stacked frame…</div>
    <div id="zoomctl">
      <button id="zoom-out" title="Zoom out (−)">&minus;</button>
      <span class="zval" id="zoom-val">100%</span>
      <button id="zoom-in" title="Zoom in (+)">+</button>
      <button id="zoom-fit" title="Fit (0)">Fit</button>
    </div>
  </div>

  <aside>
    <h1>RGB Livestacker</h1>
    <div class="sub" id="ref">no reference yet</div>

    <h2>Display stretch (linked)</h2>
    <div class="row">
      <input type="checkbox" id="auto" checked>
      <label for="auto">Auto black &amp; midtones</label>
    </div>
    <div class="ctl">
      <label for="black">Black point <span id="black-v">0.000</span></label>
      <input type="range" id="black" min="0" max="0.6" step="0.001" value="0">
    </div>
    <div class="ctl">
      <label for="midtones">Midtones <span id="midtones-v">0.500</span></label>
      <input type="range" id="midtones" min="0.01" max="0.99" step="0.005" value="0.5">
    </div>
    <div class="ctl">
      <label for="gamma">Gamma <span id="gamma-v">1.00</span></label>
      <input type="range" id="gamma" min="0.4" max="2.5" step="0.01" value="1">
    </div>
    <div class="ctl">
      <label for="contrast">Contrast <span id="contrast-v">1.00</span></label>
      <input type="range" id="contrast" min="0.5" max="2" step="0.01" value="1">
    </div>
    <a class="btn" id="save" href="/snapshot.png" download="livestack.png">Save full-res PNG</a>

    <h2>Channels</h2>
    <table id="channels"><tbody></tbody></table>

    <h2>Session</h2>
    <table>
      <tr><td>Total frames</td><td id="total">0</td></tr>
      <tr><td>Rejected</td><td id="rejected">0</td></tr>
      <tr><td>Elapsed</td><td id="elapsed">0 s</td></tr>
      <tr><td>Hot-pixel fix</td><td id="cal-hot">–</td></tr>
      <tr><td>Sigma-clip</td><td id="cal-clip">–</td></tr>
      <tr><td>Master dark</td><td id="cal-dark">–</td></tr>
      <tr><td>Flat field</td><td id="cal-flat">–</td></tr>
      <tr><td>Background</td><td id="cal-bg">–</td></tr>
      <tr><td>White balance</td><td id="cal-wb">–</td></tr>
    </table>

    <div id="conn" class="down">connecting…</div>
  </aside>

<script>
const WS_PORT = "{{WS_PORT}}";
const $ = (id) => document.getElementById(id);
const sliders = ["black", "midtones", "gamma", "contrast"];
let ws, reconnectTimer, lastUrl;

function currentParams() {
  return {
    type: "params",
    auto: $("auto").checked,
    black: parseFloat($("black").value),
    midtones: parseFloat($("midtones").value),
    gamma: parseFloat($("gamma").value),
    contrast: parseFloat($("contrast").value),
  };
}

let sendTimer;
function sendParams() {
  clearTimeout(sendTimer);
  sendTimer = setTimeout(() => {
    if (ws && ws.readyState === 1) ws.send(JSON.stringify(currentParams()));
  }, 40);
}

function reflectValues() {
  $("black-v").textContent = (+$("black").value).toFixed(3);
  $("midtones-v").textContent = (+$("midtones").value).toFixed(3);
  $("gamma-v").textContent = (+$("gamma").value).toFixed(2);
  $("contrast-v").textContent = (+$("contrast").value).toFixed(2);
  const dim = $("auto").checked;
  $("black").disabled = dim;
  $("midtones").disabled = dim;
}

sliders.forEach((id) => $(id).addEventListener("input", () => {
  reflectValues();
  sendParams();
}));
$("auto").addEventListener("change", () => { reflectValues(); sendParams(); });

function applyServerParams(p) {
  $("auto").checked = !!p.auto;
  if (p.black != null) $("black").value = p.black;
  if (p.midtones != null) $("midtones").value = p.midtones;
  if (p.gamma != null) $("gamma").value = p.gamma;
  if (p.contrast != null) $("contrast").value = p.contrast;
  reflectValues();
}

function renderStatus(s) {
  $("ref").textContent = s.reference
    ? `ref: ${s.reference} (${s.reference_filter})` : "no reference yet";
  $("total").textContent = s.total_frames;
  $("rejected").textContent = s.rejected;
  $("elapsed").textContent = `${s.elapsed} s`;
  if (s.calibration) {
    const c = s.calibration;
    $("cal-hot").textContent = c.hot_pixel ? "on" : "off";
    $("cal-clip").textContent = c.sigma_clip ? "on" : "off";
    $("cal-dark").textContent = c.dark ? c.dark.replace(/^.*\//, "") : "none";
    $("cal-flat").textContent = (c.flats && c.flats.length)
      ? c.flats.join(" ") : "none";
    $("cal-bg").textContent = c.background ? "on" : "off";
    $("cal-wb").textContent = { stars: "star flux", percentile: "percentile",
      off: "off", none: "…" }[c.white_balance] || c.white_balance || "–";
  }

  const body = $("channels").querySelector("tbody");
  body.innerHTML = "";
  const fmt = (n) => n >= 1e6 ? (n / 1e6).toFixed(1) + "M"
    : n >= 1e3 ? (n / 1e3).toFixed(0) + "k" : String(n);
  for (const [name, c] of Object.entries(s.channels)) {
    const tr = document.createElement("tr");
    const clip = c.clipped_px ? ` <span style="color:var(--dim)">(${fmt(c.clipped_px)} clipped)</span>` : "";
    tr.innerHTML = `<td class="chan-${name}">${name}</td><td>${c.frames}${clip}</td>`;
    body.appendChild(tr);
  }
  // when Auto is on, show the numbers the server actually used
  if ($("auto").checked && s.auto_params) {
    $("black").value = s.auto_params.black;
    $("midtones").value = s.auto_params.midtones;
    reflectValues();
  }
}

function showPreview(blob) {
  const url = URL.createObjectURL(blob);
  const img = $("preview");
  img.onload = () => {
    if (lastUrl) URL.revokeObjectURL(lastUrl);
    lastUrl = url;
    clampView();
    applyView();          // image size can change as the crop settles
  };
  img.src = url;
  img.hidden = false;
  $("empty").hidden = true;
  $("zoomctl").style.display = "flex";
}

/* ---- zoom & pan -------------------------------------------------------- */
const stage = $("stage");
const preview = $("preview");
const view = { scale: 1, x: 0, y: 0 };
const MIN_SCALE = 1, MAX_SCALE = 16;

function fitSize() {
  // on-screen size of the image at scale 1 (rect already includes the transform)
  const r = preview.getBoundingClientRect();
  return { w: r.width / view.scale, h: r.height / view.scale };
}

function clampView() {
  view.scale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, view.scale));
  const f = fitSize();
  const maxX = Math.max(0, (f.w * view.scale - stage.clientWidth) / 2);
  const maxY = Math.max(0, (f.h * view.scale - stage.clientHeight) / 2);
  view.x = Math.min(maxX, Math.max(-maxX, view.x));
  view.y = Math.min(maxY, Math.max(-maxY, view.y));
}

function applyView() {
  preview.style.transform =
    `translate(${view.x}px, ${view.y}px) scale(${view.scale})`;
  preview.classList.toggle("pannable", view.scale > 1.001);
  $("zoom-val").textContent = Math.round(view.scale * 100) + "%";
}

// zoom keeping the point under (clientX, clientY) fixed on screen
function zoomAt(clientX, clientY, nextScale) {
  const sr = stage.getBoundingClientRect();
  const mx = clientX - (sr.left + stage.clientWidth / 2);
  const my = clientY - (sr.top + stage.clientHeight / 2);
  nextScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, nextScale));
  const k = nextScale / view.scale;
  view.x = mx - k * (mx - view.x);
  view.y = my - k * (my - view.y);
  view.scale = nextScale;
  clampView();
  applyView();
}

function zoomCentre(factor) {
  const sr = stage.getBoundingClientRect();
  zoomAt(sr.left + stage.clientWidth / 2, sr.top + stage.clientHeight / 2,
         view.scale * factor);
}

function resetView() {
  view.scale = 1; view.x = 0; view.y = 0;
  applyView();
}

stage.addEventListener("wheel", (e) => {
  if (preview.hidden) return;
  e.preventDefault();
  zoomAt(e.clientX, e.clientY, view.scale * (e.deltaY < 0 ? 1.15 : 1 / 1.15));
}, { passive: false });

let drag = null;
preview.addEventListener("pointerdown", (e) => {
  if (preview.hidden || view.scale <= 1.001) return;
  drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y };
  preview.setPointerCapture(e.pointerId);
  preview.classList.add("dragging");
});
preview.addEventListener("pointermove", (e) => {
  if (!drag) return;
  view.x = drag.vx + (e.clientX - drag.x);
  view.y = drag.vy + (e.clientY - drag.y);
  clampView();
  applyView();
});
function endDrag(e) {
  if (!drag) return;
  drag = null;
  preview.classList.remove("dragging");
  try { preview.releasePointerCapture(e.pointerId); } catch (_) {}
}
preview.addEventListener("pointerup", endDrag);
preview.addEventListener("pointercancel", endDrag);
preview.addEventListener("dragstart", (e) => e.preventDefault());

preview.addEventListener("dblclick", (e) => {
  if (view.scale > 1.001) resetView();
  else zoomAt(e.clientX, e.clientY, 3);
});

$("zoom-in").addEventListener("click", () => zoomCentre(1.4));
$("zoom-out").addEventListener("click", () => zoomCentre(1 / 1.4));
$("zoom-fit").addEventListener("click", resetView);

window.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || preview.hidden) return;
  if (e.key === "+" || e.key === "=") zoomCentre(1.4);
  else if (e.key === "-" || e.key === "_") zoomCentre(1 / 1.4);
  else if (e.key === "0") resetView();
});

window.addEventListener("resize", () => { clampView(); applyView(); });

function connect() {
  ws = new WebSocket(`ws://${location.hostname}:${WS_PORT}`);
  ws.binaryType = "blob";
  ws.onopen = () => { $("conn").className = "ok"; $("conn").textContent = "live"; };
  ws.onclose = () => {
    $("conn").className = "down"; $("conn").textContent = "disconnected — retrying";
    clearTimeout(reconnectTimer);
    reconnectTimer = setTimeout(connect, 1500);
  };
  ws.onmessage = (ev) => {
    if (typeof ev.data !== "string") { showPreview(ev.data); return; }
    const msg = JSON.parse(ev.data);
    if (msg.type === "params") applyServerParams(msg);
    else if (msg.type === "status") renderStatus(msg);
  };
}

reflectValues();
connect();
</script>
</body>
</html>
