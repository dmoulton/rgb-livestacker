<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RGB Livestacker</title>
<style>
  :root {
    --bg: #0b0d12; --panel: #151922; --line: #262c3a;
    --text: #dfe4ee; --dim: #8a93a6; --accent: #5aa9ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.45 -apple-system, Segoe UI, Roboto, sans-serif;
    display: flex; height: 100vh; overflow: hidden;
  }
  #stage { flex: 1; min-width: 0; position: relative; overflow: hidden; }
  /* the scrolling area: the image is sized explicitly (in CSS px) from the zoom,
     and margin:auto centres it when it is smaller than the view while still
     letting it scroll from its top-left corner when it is larger. */
  #viewport {
    position: absolute; inset: 0; overflow: auto; display: flex; padding: 16px;
  }
  #preview {
    flex: none; margin: auto; box-sizing: content-box;
    background: #000; border: 1px solid var(--line); border-radius: 4px;
    user-select: none; -webkit-user-drag: none;
  }
  #preview.crisp { image-rendering: pixelated; }   /* magnified: show real pixels */
  #viewport.pannable #preview { cursor: grab; }
  #viewport.dragging, #viewport.dragging #preview { cursor: grabbing; }
  #empty { color: var(--dim); text-align: center; margin: auto; }
  #zoomctl {
    position: absolute; left: 12px; bottom: 12px; display: none;
    align-items: center; gap: 2px; padding: 3px;
    background: rgba(12,15,20,.78); border: 1px solid var(--line);
    border-radius: 6px; backdrop-filter: blur(4px);
  }
  #zoomctl button {
    padding: 3px 9px; min-width: 30px; line-height: 1.1;
  }
  #zoomctl button.on { border-color: var(--accent); color: var(--accent); }
  #zoomctl .zval {
    color: var(--dim); font-variant-numeric: tabular-nums;
    min-width: 46px; text-align: center; font-size: 12px;
  }
  aside {
    width: 340px; flex-shrink: 0; background: var(--panel);
    border-left: 1px solid var(--line); padding: 18px 18px 24px;
    overflow-y: auto; overflow-x: hidden; overflow-wrap: anywhere;
  }
  body.nosidebar aside { display: none; }
  #sidebar-toggle {
    position: absolute; top: 8px; right: 8px; z-index: 10;
    width: 30px; height: 30px; padding: 0; line-height: 1; font-size: 16px;
    background: rgba(12,15,20,.78); border: 1px solid var(--line);
    border-radius: 6px; color: var(--text); backdrop-filter: blur(4px);
  }
  h1 { font-size: 15px; margin: 0 0 4px; letter-spacing: .3px; }
  .sub { color: var(--dim); font-size: 12px; margin-bottom: 18px; overflow-wrap: anywhere; }
  h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .8px;
    color: var(--dim); margin: 22px 0 10px; font-weight: 600;
  }
  .ctl { margin-bottom: 14px; }
  .ctl label { display: flex; justify-content: space-between; margin-bottom: 5px; }
  .ctl label span:last-child { color: var(--accent); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .row input[type=checkbox] { accent-color: var(--accent); width: 15px; height: 15px; }
  button, a.btn {
    display: inline-block; background: #1e2430; color: var(--text);
    border: 1px solid var(--line); border-radius: 4px; padding: 7px 12px;
    font: inherit; cursor: pointer; text-decoration: none;
  }
  button:hover, a.btn:hover { border-color: var(--accent); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
  td { padding: 3px 0; overflow-wrap: anywhere; vertical-align: top; }
  td:last-child { text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; }
  .chan-R { color: #ff6b6b; } .chan-G { color: #59d98b; } .chan-B { color: #5aa9ff; }
  #conn { font-size: 12px; color: var(--dim); margin-top: 20px; }
  #conn.ok::before { content: "● "; color: #59d98b; }
  #conn.down::before { content: "● "; color: #ff6b6b; }
</style>
</head>
<body>
  <div id="stage">
    <div id="viewport">
      <img id="preview" alt="" hidden>
      <div id="empty">Waiting for the first stacked frame…</div>
    </div>
    <button id="sidebar-toggle" title="Hide / show the panel">›</button>
    <div id="zoomctl">
      <button id="zoom-out" title="Zoom out (−)">&minus;</button>
      <span class="zval" id="zoom-val">–</span>
      <button id="zoom-in" title="Zoom in (+)">+</button>
      <button id="zoom-100" title="Actual size, 100% (1)">100%</button>
      <button id="zoom-fit" title="Fit the whole image (0)">Fit</button>
    </div>
  </div>

  <aside>
    <h1>RGB Livestacker</h1>
    <div class="sub" id="ref">no reference yet</div>

    <h2>Display stretch (linked)</h2>
    <div class="row">
      <input type="checkbox" id="auto" checked>
      <label for="auto">Auto black &amp; midtones</label>
    </div>
    <div class="ctl">
      <label for="black">Black point <span id="black-v">0.000</span></label>
      <input type="range" id="black" min="0" max="0.6" step="0.001" value="0">
    </div>
    <div class="ctl">
      <label for="midtones">Midtones <span id="midtones-v">0.500</span></label>
      <input type="range" id="midtones" min="0.01" max="0.99" step="0.005" value="0.5">
    </div>
    <div class="ctl">
      <label for="gamma">Gamma <span id="gamma-v">1.00</span></label>
      <input type="range" id="gamma" min="0.4" max="2.5" step="0.01" value="1">
    </div>
    <div class="ctl">
      <label for="contrast">Contrast <span id="contrast-v">1.00</span></label>
      <input type="range" id="contrast" min="0.5" max="2" step="0.01" value="1">
    </div>
    <div class="ctl">
      <label for="green">Green noise (SCNR) <span id="green-v">0.00</span></label>
      <input type="range" id="green" min="0" max="1" step="0.02" value="0">
    </div>
    <div class="ctl" id="lum-ctl" hidden>
      <label for="lum">Luminance (LRGB) <span id="lum-v">1.00</span></label>
      <input type="range" id="lum" min="0" max="1" step="0.02" value="1">
    </div>
    <a class="btn" id="save" href="/snapshot.png" download="livestack.png">Save full-res PNG</a>

    <h2>Channels</h2>
    <table id="channels"><tbody></tbody></table>

    <h2>Session</h2>
    <table>
      <tr><td>Total frames</td><td id="total">0</td></tr>
      <tr><td>Rejected</td><td id="rejected">0</td></tr>
      <tr><td>Elapsed</td><td id="elapsed">0 s</td></tr>
      <tr><td>Hot-pixel fix</td><td id="cal-hot">–</td></tr>
      <tr><td>Sigma-clip</td><td id="cal-clip">–</td></tr>
      <tr><td>Master bias</td><td id="cal-bias">–</td></tr>
      <tr><td>Master dark</td><td id="cal-dark">–</td></tr>
      <tr><td>Flat field</td><td id="cal-flat">–</td></tr>
      <tr><td>Background</td><td id="cal-bg">–</td></tr>
      <tr><td>White balance</td><td id="cal-wb">–</td></tr>
    </table>

    <div id="conn" class="down">connecting…</div>
  </aside>

<script>
const WS_PORT = "{{WS_PORT}}";
const $ = (id) => document.getElementById(id);
const sliders = ["black", "midtones", "gamma", "contrast", "green", "lum"];
let ws, reconnectTimer, lastUrl;
const preview = $("preview"), viewport = $("viewport");
// z: device pixels per image pixel (1 = 100%); fit: follow the window size;
// full: ask the server for this browser's preview at full resolution
const view = { z: 1, fit: true, full: false };
let fullSize = null, previewPx = 0;      // stack size / preview limit (from status)

function currentParams() {
  return {
    type: "params",
    auto: $("auto").checked,
    black: parseFloat($("black").value),
    midtones: parseFloat($("midtones").value),
    gamma: parseFloat($("gamma").value),
    contrast: parseFloat($("contrast").value),
    green: parseFloat($("green").value),
    lum: parseFloat($("lum").value),
    full: view.full,
  };
}

/* Display settings belong to this browser: they are kept here, sent to the
   server over this connection only, and the server renders this browser's
   preview with them — another browser's sliders never touch this picture. */
const SETTINGS_KEY = "ls.display";

function saveParams() {
  const p = currentParams();
  delete p.full;                       // follows the zoom, not a saved preference
  try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(p)); }
  catch (_) {}
}

function restoreParams() {
  try {
    const p = JSON.parse(localStorage.getItem(SETTINGS_KEY) || "null");
    if (p) applyParams(p);
  } catch (_) {}
}

function applyParams(p) {
  if (p.auto != null) $("auto").checked = !!p.auto;
  for (const id of sliders) {
    if (p[id] != null && isFinite(p[id])) $(id).value = p[id];
  }
}

// the snapshot link carries this browser's settings so the PNG matches its view
function updateSaveLink() {
  const p = currentParams();
  delete p.type; delete p.full;        // the PNG is always full size
  p.auto = p.auto ? 1 : 0;
  $("save").href = "/snapshot.png?" + new URLSearchParams(p).toString();
}

function sendNow() {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify(currentParams()));
}

let sendTimer;
function sendParams() {
  saveParams();
  clearTimeout(sendTimer);
  sendTimer = setTimeout(sendNow, 40);
}

function reflectValues() {
  updateSaveLink();
  $("black-v").textContent = (+$("black").value).toFixed(3);
  $("midtones-v").textContent = (+$("midtones").value).toFixed(3);
  $("gamma-v").textContent = (+$("gamma").value).toFixed(2);
  $("contrast-v").textContent = (+$("contrast").value).toFixed(2);
  $("green-v").textContent = (+$("green").value).toFixed(2);
  $("lum-v").textContent = (+$("lum").value).toFixed(2);
  const dim = $("auto").checked;
  $("black").disabled = dim;
  $("midtones").disabled = dim;
}

sliders.forEach((id) => $(id).addEventListener("input", () => {
  reflectValues();
  sendParams();
}));
$("auto").addEventListener("change", () => { reflectValues(); sendParams(); });

function renderStatus(s) {
  if (s.size) {                        // full stack size, for true-pixel zoom
    fullSize = { w: s.size[0], h: s.size[1] };
    previewPx = s.preview_px || 0;
    applyView();
  }
  $("ref").textContent = s.reference
    ? `ref: ${s.reference} (${s.reference_filter})` : "no reference yet";
  $("total").textContent = s.total_frames;
  $("rejected").textContent = s.rejected;
  $("elapsed").textContent = `${s.elapsed} s`;
  $("lum-ctl").hidden = !s.luminance;
  if (s.calibration) {
    const c = s.calibration;
    $("cal-hot").textContent = c.hot_pixel ? "on" : "off";
    $("cal-clip").textContent = c.sigma_clip ? "on" : "off";
    $("cal-bias").textContent = c.bias ? c.bias.replace(/^.*\//, "") : "none";
    $("cal-dark").textContent = c.dark ? c.dark.replace(/^.*\//, "") : "none";
    $("cal-flat").textContent = (c.flats && c.flats.length)
      ? c.flats.join(" ") : "none";
    $("cal-bg").textContent = c.background ? "on" : "off";
    $("cal-wb").textContent = { stars: "star flux", percentile: "percentile",
      off: "off", none: "…" }[c.white_balance] || c.white_balance || "–";
  }

  const body = $("channels").querySelector("tbody");
  body.innerHTML = "";
  const fmt = (n) => n >= 1e6 ? (n / 1e6).toFixed(1) + "M"
    : n >= 1e3 ? (n / 1e3).toFixed(0) + "k" : String(n);
  for (const [name, c] of Object.entries(s.channels)) {
    const tr = document.createElement("tr");
    const clip = c.clipped_px ? ` <span style="color:var(--dim)">(${fmt(c.clipped_px)} clipped)</span>` : "";
    tr.innerHTML = `<td class="chan-${name}">${name}</td><td>${c.frames}${clip}</td>`;
    body.appendChild(tr);
  }
  // when Auto is on, show the numbers the server actually used
  if ($("auto").checked && s.auto_params) {
    $("black").value = s.auto_params.black;
    $("midtones").value = s.auto_params.midtones;
    reflectValues();
  }
}

function showPreview(blob) {
  const url = URL.createObjectURL(blob);
  preview.onload = () => {
    if (lastUrl) URL.revokeObjectURL(lastUrl);
    lastUrl = url;
    applyView();          // size / crispness depend on what actually arrived
  };
  preview.src = url;
  preview.hidden = false;
  $("empty").hidden = true;
  $("zoomctl").style.display = "flex";
}

/* ---- zoom & pan --------------------------------------------------------
   Zoom is measured in real image pixels. 100% shows one image pixel per screen
   pixel (so a large stack overflows the window and scrolls / pans), "Fit"
   shrinks the whole image to the window, and every other percentage scales from
   that same 100%. `view.z` is device pixels per image pixel. */
const PAD = 16, MAX_Z = 16;
const dpr = () => window.devicePixelRatio || 1;

// size of the full stack (not of the possibly-downscaled preview we received)
function imageSize() {
  if (fullSize) return fullSize;
  return preview.naturalWidth
    ? { w: preview.naturalWidth, h: preview.naturalHeight } : null;
}

function fitZ() {
  const s = imageSize();
  if (!s) return 1;
  const aw = Math.max(50, viewport.clientWidth - 2 * PAD - 2);
  const ah = Math.max(50, viewport.clientHeight - 2 * PAD - 2);
  return Math.min(aw / s.w, ah / s.h) * dpr();
}

function applyView() {
  const s = imageSize();
  if (!s || preview.hidden) return;
  const fit = fitZ();
  if (view.fit) view.z = fit;
  view.z = Math.min(MAX_Z, Math.max(Math.min(fit, 1), view.z));
  view.fit = Math.abs(view.z - fit) < fit * 0.002;

  const css = view.z / dpr();
  preview.style.width = (s.w * css) + "px";
  preview.style.height = (s.h * css) + "px";
  $("zoom-val").textContent = Math.round(view.z * 100) + "%";
  $("zoom-fit").classList.toggle("on", view.fit);
  $("zoom-100").classList.toggle("on", Math.abs(view.z - 1) < 0.005);
  // magnified and we hold the real pixels: show them crisp, not smoothed
  preview.classList.toggle("crisp", view.z > 1.001 && preview.naturalWidth >= s.w - 1);
  viewport.classList.toggle("pannable",
    viewport.scrollWidth > viewport.clientWidth + 1 ||
    viewport.scrollHeight > viewport.clientHeight + 1);
  updateFullRequest();
}

// Past the preview's own resolution there is nothing more to see in it, so ask
// the server to send this browser's picture at full size (and drop back to the
// small preview when zoomed out again). The Fit view always uses the preview.
function updateFullRequest() {
  const s = imageSize();
  let want = false;
  if (s && previewPx && !view.fit && Math.max(s.w, s.h) > previewPx) {
    const p0 = previewPx / Math.max(s.w, s.h);     // preview px per image px
    want = view.z > p0 * (view.full ? 0.9 : 1.0);
  }
  if (want !== view.full) { view.full = want; sendParams(); }
}

// zoom to `z`, keeping the point under (cx, cy) fixed on screen
function zoomAt(cx, cy, z) {
  if (!imageSize() || preview.hidden) return;
  const r = preview.getBoundingClientRect();
  const fx = r.width ? Math.min(1, Math.max(0, (cx - r.left) / r.width)) : 0.5;
  const fy = r.height ? Math.min(1, Math.max(0, (cy - r.top) / r.height)) : 0.5;
  view.fit = false;
  view.z = z;
  applyView();
  const r2 = preview.getBoundingClientRect();
  viewport.scrollLeft += r2.left + fx * r2.width - cx;
  viewport.scrollTop += r2.top + fy * r2.height - cy;
}

function viewCentre() {
  const r = viewport.getBoundingClientRect();
  return [r.left + r.width / 2, r.top + r.height / 2];
}
function zoomCentre(factor) { zoomAt(...viewCentre(), view.z * factor); }
function showActual(cx, cy) {
  zoomAt(...(cx == null ? viewCentre() : [cx, cy]), 1);
}
function showFit() {
  view.fit = true;
  applyView();
  viewport.scrollLeft = 0;
  viewport.scrollTop = 0;
}

viewport.addEventListener("wheel", (e) => {
  if (preview.hidden) return;
  e.preventDefault();
  zoomAt(e.clientX, e.clientY, view.z * (e.deltaY < 0 ? 1.15 : 1 / 1.15));
}, { passive: false });

// drag to pan (the scrollbars work too)
let drag = null;
viewport.addEventListener("pointerdown", (e) => {
  if (preview.hidden || e.pointerType !== "mouse" || e.button !== 0) return;
  if (!viewport.classList.contains("pannable")) return;
  const r = viewport.getBoundingClientRect();
  if (e.clientX - r.left >= viewport.clientWidth ||
      e.clientY - r.top >= viewport.clientHeight) return;      // on a scrollbar
  drag = { x: e.clientX, y: e.clientY,
           l: viewport.scrollLeft, t: viewport.scrollTop };
  viewport.setPointerCapture(e.pointerId);
  viewport.classList.add("dragging");
});
viewport.addEventListener("pointermove", (e) => {
  if (!drag) return;
  viewport.scrollLeft = drag.l - (e.clientX - drag.x);
  viewport.scrollTop = drag.t - (e.clientY - drag.y);
});
function endDrag(e) {
  if (!drag) return;
  drag = null;
  viewport.classList.remove("dragging");
  try { viewport.releasePointerCapture(e.pointerId); } catch (_) {}
}
viewport.addEventListener("pointerup", endDrag);
viewport.addEventListener("pointercancel", endDrag);
preview.addEventListener("dragstart", (e) => e.preventDefault());

// double-click toggles between 100% (at the clicked point) and Fit
preview.addEventListener("dblclick", (e) => {
  if (view.fit || view.z < 0.999) showActual(e.clientX, e.clientY);
  else showFit();
});

$("zoom-in").addEventListener("click", () => zoomCentre(1.4));
$("zoom-out").addEventListener("click", () => zoomCentre(1 / 1.4));
$("zoom-100").addEventListener("click", () => showActual());
$("zoom-fit").addEventListener("click", showFit);

window.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "\\") { toggleSidebar(); return; }
  if (preview.hidden) return;
  if (e.key === "+" || e.key === "=") zoomCentre(1.4);
  else if (e.key === "-" || e.key === "_") zoomCentre(1 / 1.4);
  else if (e.key === "1") showActual();
  else if (e.key === "0") showFit();
});

window.addEventListener("resize", applyView);

/* ---- sidebar show / hide ------------------------------------------------ */
function setSidebar(hidden) {
  document.body.classList.toggle("nosidebar", hidden);
  $("sidebar-toggle").textContent = hidden ? "‹" : "›";
  $("sidebar-toggle").title = (hidden ? "Show" : "Hide") + " the panel  (\\)";
  try { localStorage.setItem("ls.sidebar", hidden ? "hidden" : "shown"); } catch (_) {}
  // the stage width changed — re-fit the preview
  requestAnimationFrame(applyView);
}
function toggleSidebar() {
  setSidebar(!document.body.classList.contains("nosidebar"));
}
$("sidebar-toggle").addEventListener("click", toggleSidebar);
try {
  if (localStorage.getItem("ls.sidebar") === "hidden") setSidebar(true);
} catch (_) {}

function connect() {
  ws = new WebSocket(`ws://${location.hostname}:${WS_PORT}`);
  ws.binaryType = "blob";
  ws.onopen = () => {
    $("conn").className = "ok"; $("conn").textContent = "live";
    sendNow();            // (re)introduce this browser's own display settings
  };
  ws.onclose = () => {
    $("conn").className = "down"; $("conn").textContent = "disconnected — retrying";
    clearTimeout(reconnectTimer);
    reconnectTimer = setTimeout(connect, 1500);
  };
  ws.onmessage = (ev) => {
    if (typeof ev.data !== "string") { showPreview(ev.data); return; }
    const msg = JSON.parse(ev.data);
    if (msg.type === "status") renderStatus(msg);
  };
}

restoreParams();
reflectValues();
connect();
</script>
</body>
</html>
